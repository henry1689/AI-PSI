# Alembic configuration.
#
# NOTE: This file is intentionally ASCII-only.
# Python's configparser reads .ini files with the *locale* encoding
# (GBK on a zh-CN Windows box), not UTF-8. Non-ASCII comments here cause
# UnicodeDecodeError at import time. Keep this file ASCII.
#
# NOTE: sqlalchemy.url is deliberately absent.
# The connection string contains a password and must never enter version
# control. migrations/env.py injects it from AI_PSI_DATABASE_URL.

[alembic]
script_location = migrations
prepend_sys_path = .
# Required by Alembic 1.16+. Without it, prepend_sys_path falls back to legacy
# splitting and emits a DeprecationWarning. Under the project's pytest setting
# `filterwarnings = ["error"]` that warning becomes a test failure.
path_separator = os
timezone = UTC

# Timestamp-prefixed revision filenames so the directory sorts chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# NOTE: no [post_write_hooks] section on purpose.
# An earlier attempt used `type = console_scripts, entrypoint = ruff`, which
# fails with "Could not find entrypoint console_scripts.ruff" because ruff
# ships as a binary distribution without that entry point registered.
# Generated revisions are instead covered by the normal `ruff check/format`
# run over the repository (migrations/ is NOT excluded from ruff).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
