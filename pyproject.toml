[project]
name = "ai-psi"
version = "0.1.0"
description = "AI-PSI Cognitive Runtime — 可追踪、可测试、可纠正的语言认知内核"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "henry" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# 阶段 1 只声明真正被代码使用的依赖（ADR-0007 / ADR-0012）。
# FastAPI / SQLAlchemy / Alembic / structlog 在对应阶段（2、3）引入，此处不预留。
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_psi"]

# ---------------------------------------------------------------------------
# Ruff — lint + format 统一入口
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
# *.md 必须排除：ruff 0.14+ 会格式化 Markdown 中的 Python 代码块，
# 而 docs/ 下的文档（尤其任务书）含有大量作为**示例**的代码片段，
# 其中不乏伪代码与省略号占位，格式化它们会破坏需求文档的可读性与原意。
extend-exclude = ["migrations", "evals/datasets", "**/*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
# 本项目注释与文档字符串以中文书写，歧义 Unicode 规则会产生大量误报（ADR-0007）。
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/**" = []

[tool.ruff.lint.isort]
known-first-party = ["ai_psi"]

# ---------------------------------------------------------------------------
# mypy — 严格模式（任务书要求 mypy 或 pyright 二选一，ADR-0007 选 mypy）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/", "^evals/datasets/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
# 测试允许放松：Hypothesis 装饰器与 pytest fixture 的类型推断在 strict 下噪声过大
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
    "slow: 运行较慢的测试",
    "integration: 需要数据库的集成测试（阶段 2 起）",
    "scenario: 任务书第十五节场景测试（阶段 3 起）",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ai_psi"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"