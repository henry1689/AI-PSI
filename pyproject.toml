[project]
name = "ai-psi"
version = "0.1.0"
description = "AI-PSI Cognitive Runtime — 可追踪、可测试、可纠正的语言认知内核"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "henry" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# 只声明真正被代码使用的依赖（ADR-0007 / ADR-0012）。
# FastAPI 在阶段 3 引入，此处不预留。
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    # 阶段 2：数据库、事件存储与结构化日志
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "structlog>=24.4",
    # 阶段 3：API 层与进程入口
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 阶段 4：真实 Provider 的 HTTP 客户端
    "httpx>=0.27",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_psi"]

# ---------------------------------------------------------------------------
# Ruff — lint + format 统一入口
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
# *.md 必须排除：ruff 0.14+ 会格式化 Markdown 中的 Python 代码块，
# 而 docs/ 下的文档（尤其任务书）含有大量作为**示例**的代码片段，
# 其中不乏伪代码与省略号占位，格式化它们会破坏需求文档的可读性与原意。
#
# migrations/ **不排除**——生成的迁移也是代码，同样要过 lint。
extend-exclude = ["evals/datasets", "**/*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
# 本项目注释与文档字符串以中文书写，歧义 Unicode 规则会产生大量误报（ADR-0007）。
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# 生成的迁移文件：
# * E501 —— CHECK 约束表达式是机器生成的长字符串，换行会破坏可读性且下次生成又被覆盖；
# * F401 —— 模板统一导入 `postgresql`，但并非每条迁移都用得到 PG 专有类型。
"migrations/versions/*" = ["E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["ai_psi"]

# ---------------------------------------------------------------------------
# mypy — 严格模式（任务书要求 mypy 或 pyright 二选一，ADR-0007 选 mypy）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/", "^evals/datasets/"]

[[tool.mypy.overrides]]
# ⚠️ 模式必须是**全限定模块名**。此前写成 ["tests.*", "test_*", ...]，
# 其中 "test_*" 不被接受，导致 mypy **整张 override 表被拒绝**——
# 表现为设置"静默不生效"，且命令行 --allow-untyped-defs 也压不住。
# 正确的做法是让 tests/ 成为真正的包（已加 __init__.py），
# 模块名形如 tests.unit.test_events，用单一模式即可覆盖。
module = ["tests.*"]
# 测试代码只放宽**两项**，且都有明确原因（ADR-0007）：
#
# 1. disallow_untyped_decorators —— Hypothesis 的 @given/@settings
#    装饰器在 strict 下类型推断噪声过大；
# 2. disallow_untyped_defs / disallow_incomplete_defs —— pytest 按**名字**注入
#    fixture，测试函数参数（如 make_observation）无法有意义地标注类型。
#    注意二者是**不同**的开关：测试函数通常写了返回值标注但没写参数标注，
#    触发的是 disallow_incomplete_defs，只关前者不解决问题。
#
# 其余检查一律保持开启：`check_untyped_defs` 仍然检查未标注函数的**函数体**，
# 因此 arg-type / call-arg 等真实错误依旧会被捕获。
# 需要故意构造非法对象的测试，请使用 tests/helpers.py 的 construct()。
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
    "unit: 纯领域层单元测试，零 IO（阶段 1 起）",
    "property: Hypothesis 属性测试（阶段 1 起）",
    "slow: 运行较慢的测试",
    "integration: 需要数据库的集成测试（阶段 2 起）",
    "scenario: 任务书第十五节场景测试（阶段 3 起）",
    "live: 需要真实模型 API 与网络，默认跳过（阶段 4 起）",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ai_psi"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol 的方法体是 `...` 占位——它们**永远不会被执行**，
    # 统计它们会把"接口定义完整度"误报成"测试没覆盖"。
    '^\s*\.\.\.$',
    # @overload / @abstractmethod 声明同理
    '^\s*@(overload|abstractmethod)$',
]

[tool.coverage.html]
directory = "htmlcov"
